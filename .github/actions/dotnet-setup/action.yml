name: Set up .NET
description: Installs the .NET SDK and restores the NuGet cache.

# The calling job checks out before it calls this action. This action does not check out.

inputs:
  dotnet-version:
    description: .NET SDK versions, one per line
    required: false
    # The newest SDK builds every target framework, and each older one supplies the runtime its
    # target framework needs to run tests. Add a line here when a target framework is added.
    default: |
      8.0.x
      10.0.x

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
